[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resnet50-int8-pipeline"
version = "0.1.0"
description = "Auditable ResNet50 INT8 golden-to-hardware integration pipeline"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
resnet50-pipeline = "resnet50_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["resnet50_pipeline*"]

[tool.unittest]
start-directory = "tests"
